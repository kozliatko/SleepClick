name: Security — secret scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — scan code and git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$(pwd)":/repo \
            zricethezav/gitleaks:latest \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --verbose \
              --redact \
              --exit-code 1
