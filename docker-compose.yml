services:
  sleepclick:
    build: .
    restart: unless-stopped
    networks:
      - default
      - caddy
    labels:
      caddy: ${CADDY_DOMAIN}
      # Catch-all. Caddy orders handle blocks by path specificity, not by the
      # order it discovers containers, so the backend's routes below win over
      # this one regardless of which container starts first.
      caddy.handle: /*
      caddy.handle.reverse_proxy: "{{upstreams 80}}"
      caddy.encode: gzip zstd

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - backend_data:/data
    networks:
      - default
      - caddy
    labels:
      caddy: ${CADDY_DOMAIN}
      # One rule for every route in this project: `handle`, never `handle_path`.
      # The prefix survives the proxy hop, so a path means the same thing in
      # server.js as it does in the browser's address bar. Nothing to remember
      # per route, and adding one is copy-paste plus a new index.
      caddy.handle_0: /api/*
      caddy.handle_0.reverse_proxy: "{{upstreams 8080}}"
      # Admin UI. Basic auth is enforced by the app itself, not here — the
      # container is reachable from every service on the caddy network, so a
      # gate only at the proxy would leave it open from inside.
      caddy.handle_1: /admin*
      caddy.handle_1.reverse_proxy: "{{upstreams 8080}}"

networks:
  caddy:
    external: true

volumes:
  backend_data:
