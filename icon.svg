<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b4b" />
      <stop offset="100%" stop-color="#06091e" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffe57a" />
      <stop offset="55%" stop-color="#f0a0ff" />
      <stop offset="100%" stop-color="#9c4dff" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="60%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffe57a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9c4dff" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="moonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="115" />
    </clipPath>
  </defs>

  <!-- Clipped background -->
  <g clip-path="url(#roundedSquare)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Subtle nebula/atmosphere glow -->
    <ellipse cx="256" cy="220" rx="200" ry="180" fill="url(#moonGlow)" />

    <!-- Outer soft glow ring behind moon -->
    <circle cx="256" cy="230" r="148" fill="none" stroke="url(#glowRing)" stroke-width="48" filter="url(#softGlow)" />

    <!-- Stars -->
    <circle cx="110" cy="115" r="3.5" fill="#ffffff" opacity="0.9" />
    <circle cx="148" cy="168" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="390" cy="98" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="420" cy="155" r="3" fill="#ffffff" opacity="0.7" />
    <circle cx="78" cy="245" r="2" fill="#ffffff" opacity="0.5" />
    <circle cx="435" cy="310" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="92" cy="380" r="2" fill="#ffffff" opacity="0.5" />
    <circle cx="170" cy="90" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="345" cy="75" r="2" fill="#ffffff" opacity="0.6" />
    <!-- Twinkling 4-point star -->
    <path d="M420 200 L423 209 L432 212 L423 215 L420 224 L417 215 L408 212 L417 209 Z" fill="#ffffff" opacity="0.7" />
    <path d="M95 160 L97 166 L103 168 L97 170 L95 176 L93 170 L87 168 L93 166 Z" fill="#ffffff" opacity="0.6" />

    <!-- Moon crescent (two overlapping circles technique) -->
    <!-- Main moon circle with glow -->
    <circle cx="248" cy="228" r="138" fill="url(#moonGrad)" filter="url(#moonBlur)" />
    <!-- Cutout circle for crescent shape -->
    <circle cx="302" cy="196" r="122" fill="url(#bgGrad)" />

    <!-- Zzz text as design element -->
    <g opacity="0.85" filter="url(#softGlow)">
      <!-- Z1 (large) -->
      <path d="M308 298 L348 298 L308 340 L348 340"
            stroke="#c4a6ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Z2 (medium) -->
      <path d="M353 268 L385 268 L353 302 L385 302"
            stroke="#c4a6ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75" />
      <!-- Z3 (small) -->
      <path d="M390 245 L414 245 L390 270 L414 270"
            stroke="#c4a6ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55" />
    </g>
  </g>
</svg>
